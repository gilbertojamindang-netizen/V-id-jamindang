<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VØID.NET</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* GLOWING TEXT SELECTION */
        ::selection {
            background: #00fff9;
            color: #000;
            text-shadow: 0 0 8px #00fff9;
        }

        body { 
            background: #050505; 
            color: #e0e0e0; 
            font-family: 'Share Tech Mono', monospace; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
        }

        .header { text-align: center; margin-bottom: 20px; width: 100%; max-width: 600px; }
        
        .glitch { 
            font-size: clamp(1.8rem, 6vw, 3rem); 
            letter-spacing: 2px; 
            color: #fff; 
            position: relative; 
            margin-bottom: 5px; 
            font-weight: bold; 
            text-transform: uppercase; 
        }
        .glitch::before, .glitch::after { 
            content: attr(data-text); 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; background: transparent; 
        }
        .glitch::before { left: 3px; text-shadow: -2px 0 #ff00c1; animation: glitch-anim-1 2s infinite linear alternate-reverse; }
        .glitch::after { left: -3px; text-shadow: -2px 0 #00fff9; animation: glitch-anim-2 2s infinite linear alternate-reverse; }
        
        @keyframes glitch-anim-1 { 
            0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, -1px); } 
            20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, 1px); } 
            40% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); } 
            60% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -1px); } 
            100% { clip-path: inset(30% 0 50% 0); transform: translate(1px, -2px); } 
        }
        @keyframes glitch-anim-2 { 
            0% { clip-path: inset(10% 0 60% 0); transform: translate(2px, 1px); } 
            20% { clip-path: inset(30% 0 20% 0); transform: translate(-2px, -1px); } 
            40% { clip-path: inset(70% 0 10% 0); transform: translate(2px, 2px); } 
            60% { clip-path: inset(20% 0 50% 0); transform: translate(-2px, -2px); } 
            100% { clip-path: inset(10% 0 80% 0); transform: translate(-1px, -1px); } 
        }

        .quick-trip {
            color: #00fff9;
            font-size: 1.1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 15px;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0, 255, 249, 0.5);
        }

        .subtitle { color: #aaa; font-size: 0.85rem; line-height: 1.4; margin-bottom: 20px; }
        
        .top-pills { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 25px; }
        .pill { border: 1px solid #333; padding: 8px 16px; border-radius: 20px; font-size: 0.75rem; color: #ccc; text-transform: uppercase; }
        
        .search-box { 
            width: 100%; max-width: 600px; background: #0a0a0a; border: 1px solid #222; border-radius: 10px; 
            padding: 15px 20px; color: #fff; font-family: inherit; font-size: 1rem; outline: none; margin-bottom: 20px; 
            transition: all 0.3s ease;
        }
        .search-box:focus { 
            border-color: #00fff9; 
            box-shadow: 0 0 10px rgba(0, 255, 249, 0.3); 
        }
        
        .file-count { font-size: 0.8rem; color: #888; margin-bottom: 15px; width: 100%; max-width: 600px; padding-left: 5px; }
        
        .filter-row { display: flex; gap: 10px; width: 100%; max-width: 600px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; }
        .filter-row::-webkit-scrollbar { display: none; }
        
        /* GLOWING FILTER BUTTONS */
        .filter-btn { 
            background: #0a0a0a; border: 1px solid #222; color: #aaa; padding: 8px 16px; 
            border-radius: 8px; font-family: inherit; cursor: pointer; font-size: 0.9rem; 
            transition: all 0.3s ease;
        }
        .filter-btn:hover { border-color: #555; color: #fff; }
        
        /* GANTO YUNG GLOW PAG SELECTED */
        .filter-btn.active { 
            background: #fff; 
            color: #000; 
            border-color: #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.6), 0 0 5px #00fff9 inset;
            text-shadow: 0 0 2px #fff;
        }
        
        .safety { 
            width: 100%; max-width: 600px; background: #0a0a0a; border: 1px solid #222; border-radius: 10px; 
            padding: 15px 20px; margin-bottom: 25px; font-size: 0.8rem; color: #888; line-height: 1.5; 
        }
        
        .grid-container { width: 100%; max-width: 600px; display: grid; gap: 15px; }
        
        .card { background: #0a0a0a; border: 1px solid #222; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; }
        .card:hover { border-color: #444; }
        .card-top { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        
        .badge-box { 
            width: 50px; height: 50px; border: 1px solid #333; border-radius: 8px; 
            display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; color: #ccc; flex-shrink: 0; 
        }
        
        .file-name { font-size: 1.1rem; color: #fff; word-break: break-all; margin-bottom: 4px; }
        .file-type { font-size: 0.75rem; color: #666; }

        /* AUTO-GLITCH DOWNLOAD BUTTON */
        .download-btn { 
            background: #fff; 
            color: #000; 
            text-decoration: none; 
            padding: 12px 20px; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 0.9rem; 
            text-align: center; 
            width: 100%; 
            display: block;
            position: relative;
            animation: autoGlitch 3s infinite linear alternate; 
            transition: transform 0.2s;
        }

        .download-btn:hover {
            transform: scale(1.05);
            animation: intenseGlitch 0.2s infinite linear alternate;
        }

        @keyframes autoGlitch {
            0%, 85%, 100% { text-shadow: none; box-shadow: none; transform: translate(0); background: #fff; }
            87% { text-shadow: -2px 0 #ff00c1, 2px 0 #00fff9; box-shadow: -2px 0 #ff00c1, 2px 0 #00fff9; transform: translate(-1px, 1px); background: #e0e0e0; }
            89% { text-shadow: 2px 0 #ff00c1, -2px 0 #00fff9; box-shadow: 2px 0 #ff00c1, -2px 0 #00fff9; transform: translate(1px, -1px); background: #fff; }
            91% { text-shadow: -1px 0 #ff00c1, 1px 0 #00fff9; box-shadow: -1px 0 #ff00c1, 1px 0 #00fff9; transform: translate(-1px, -1px); background: #ccc; }
            93% { text-shadow: 1px 0 #ff00c1, -1px 0 #00fff9; box-shadow: 1px 0 #ff00c1, -1px 0 #00fff9; transform: translate(1px, 1px); background: #fff; }
        }

        @keyframes intenseGlitch {
            0% { transform: translate(0); clip-path: inset(10% 0 80% 0); }
            20% { transform: translate(-3px, 2px); clip-path: inset(60% 0 10% 0); }
            40% { transform: translate(3px, -1px); clip-path: inset(30% 0 50% 0); }
            60% { transform: translate(-2px, -2px); clip-path: inset(80% 0 5% 0); }
            80% { transform: translate(2px, 2px); clip-path: inset(20% 0 60% 0); }
            100% { transform: translate(-1px, 1px); clip-path: inset(50% 0 20% 0); }
        }

        /* GLITCH EFFECT PAG NAG-SELECT / FILTER */
        .glitching {
            animation: cardGlitch 0.3s linear;
        }

        @keyframes cardGlitch {
            0% { transform: translate(0); filter: none; }
            20% { transform: translate(-4px, 2px); filter: hue-rotate(90deg) invert(10%); }
            40% { transform: translate(4px, -2px); filter: hue-rotate(180deg); }
            60% { transform: translate(-2px, -4px); filter: hue-rotate(270deg) invert(20%); }
            80% { transform: translate(2px, 4px); filter: hue-rotate(360deg); }
            100% { transform: translate(0); filter: none; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="glitch" data-text="VØID.NET">VØID.NET</h1>
        <div class="quick-trip">Quick trip bypass</div>
        <p class="subtitle">A dark digital archive. Search files by name or filter by file type.</p>
        
        <div class="top-pills">
            <span class="pill" id="totalFilesPill">23 FILES</span>
            <span class="pill">BLACK / WHITE</span>
        </div>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="Search files...">
    <div class="file-count" id="fileCountDisplay">23 files</div>

    <div class="filter-row">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="bat">BAT</button>
        <button class="filter-btn" data-filter="ps1">PS1</button>
        <button class="filter-btn" data-filter="inf">INF</button>
        <button class="filter-btn" data-filter="vbs">VBS</button>
        <button class="filter-btn" data-filter="vmx">VMX</button>
        <button class="filter-btn" data-filter="exe">EXE</button>
    </div>

    <div class="safety">
        <strong>Safety notice:</strong> File contents have not been verified. Be careful with scripts and configuration files. Only run files you trust and understand.
    </div>

    <div class="grid-container" id="fileGrid"></div>

    <script>
        const files = [
            { name: "01_clean_vm.bat", type: "bat", url: "https://www.mediafire.com/file/8d8oa8zy53brb1x/01_clean_vm.bat/file" },
            { name: "02_cloud_bypass.ps1", type: "ps1", url: "https://www.mediafire.com/file/iottqvyvzykfscb/02_cloud_bypass.ps1/file" },
            { name: "03_uac_off.bat", type: "bat", url: "https://www.mediafire.com/file/9gvuf6ezusg7ngq/03_uac_off.bat/file" },
            { name: "04_spoof_hwid.ps1", type: "ps1", url: "https://www.mediafire.com/file/yzaqjj9pc8q0d1e/04_spoof_hwid.ps1/file" },
            { name: "05_bypass_amsi.ps1", type: "ps1", url: "https://www.mediafire.com/file/975i4bue6y9qhhg/05_bypass_amsi.ps1/file" },
            { name: "06_defender_off.bat", type: "bat", url: "https://www.mediafire.com/file/ye3qu4fun76ylxx/06_defender_off.bat/file" },
            { name: "07_kill_telemetry.bat", type: "bat", url: "https://www.mediafire.com/file/za5gvr8v1rfpnn0/07_kill_telemetry.bat/file" },
            { name: "08_killac.bat", type: "bat", url: "https://www.mediafire.com/file/r2jbfbpng19dkpq/08_killac.bat/file" },
            { name: "09_anti_shutdown.ps1", type: "ps1", url: "https://www.mediafire.com/file/layjou0o52rpx1r/09_anti_shutdown.ps1/file" },
            { name: "10_no_sleep.bat", type: "bat", url: "https://www.mediafire.com/file/40q39ayjbgtcdxp/10_no_sleep.bat/file" },
            { name: "11_anti_idle.bat", type: "bat", url: "https://www.mediafire.com/file/kef6d0z4e0lf2px/11_anti_idle.bat/file" },
            { name: "12_start_watchdog.vbs", type: "vbs", url: "https://www.mediafire.com/file/y32u4o22tis0s7q/12_start_watchdog.vbs/file" },
            { name: "12_watchdog.bat", type: "bat", url: "https://www.mediafire.com/file/9b85fy6whvcmwif/12_watchdog.bat/file" },
            { name: "13_freeze_timer.ps1", type: "ps1", url: "https://www.mediafire.com/file/99fn26tlhqmflxg/13_freeze_timer.ps1/file" },
            { name: "14_hide_proc.ps1", type: "ps1", url: "https://www.mediafire.com/file/6zxyxfhn71o5iqq/14_hide_proc.ps1/file" },
            { name: "15_noshot.ps1", type: "ps1", url: "https://www.mediafire.com/file/xk2sl1qdi9ujayh/15_noshot.ps1/file" },
            { name: "16_stealth.bat", type: "bat", url: "https://www.mediafire.com/file/jn50ueqkptb89rm/16_stealth.bat/file" },
            { name: "17_kick_spies.bat", type: "bat", url: "https://www.mediafire.com/file/exb2kl9y7lby9m1/17_kick_spies.bat/file" },
            { name: "18_add_user.bat", type: "bat", url: "https://www.mediafire.com/file/vlgsadujbez7060/18_add_user.bat/file" },
            { name: "99_panic_wipe.bat", type: "bat", url: "https://www.mediafire.com/file/s7s18i1qx7jpe3c/99_panic_wipe.bat/file" },
            { name: "cloudpc.vmx", type: "vmx", url: "https://www.mediafire.com/file/l36axyphcecore1/cloudpc.vmx/file" },
            { name: "autorun.inf", type: "inf", url: "https://www.mediafire.com/file/nzaatwnwns2n1xd/autorun.inf/file" },
            { name: "uuyc_4.43.0.exe", type: "exe", url: "https://www.mediafire.com/file/x41vbp22bspse63/uuyc_4.43.0.exe/file" }
        ];

        const grid = document.getElementById('fileGrid');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const countDisplay = document.getElementById('fileCountDisplay');
        
        function renderCards() {
            grid.innerHTML = '';
            files.forEach((file) => {
                const card = document.createElement('div');
                card.className = 'card file-card';
                card.setAttribute('data-type', file.type);
                card.setAttribute('data-name', file.name.toLowerCase());
                card.innerHTML = `
                    <div class="card-top">
                        <div class="badge-box">${file.type.toUpperCase()}</div>
                        <div>
                            <div class="file-name">${file.name}</div>
                            <div class="file-type">.${file.type.toUpperCase()} FILE</div>
                        </div>
                    </div>
                    <a href="${file.url}" target="_blank" class="download-btn">Download</a>
                `;
                grid.appendChild(card);
            });
            updateDisplay();
        }

        let currentFilter = 'all';
        let currentSearch = '';

        function updateDisplay() {
            const cards = document.querySelectorAll('.file-card');
            let visibleCount = 0;

            cards.forEach(card => {
                const name = card.getAttribute('data-name');
                const type = card.getAttribute('data-type');
                
                const matchSearch = name.includes(currentSearch);
                const matchFilter = currentFilter === 'all' || type === currentFilter;

                if (matchSearch && matchFilter) {
                    card.style.display = 'flex';
                    visibleCount++;
                    // Trigger glitch animation
                    card.classList.add('glitching');
                    setTimeout(() => card.classList.remove('glitching'), 300);
                } else {
                    card.style.display = 'none';
                }
            });
            countDisplay.textContent = visibleCount + ' files';
            document.getElementById('totalFilesPill').textContent = files.length + ' FILES';
        }

        searchInput.addEventListener('input', (e) => {
            currentSearch = e.target.value.toLowerCase();
            updateDisplay();
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                filterBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.getAttribute('data-filter');
                updateDisplay();
            });
        });

        renderCards();
    </script>
</body>
</html>
